# Increase the memory available to Gradle (Minecraft + Loom need a fair amount).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Loom is not fully configuration-cache safe yet, keep it off.
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Fabric / Minecraft properties (verified against https://fabricmc.net/develop
# and meta.fabricmc.net for Minecraft 1.21.11)
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
# The oldest loader verified working in a live client run (the mixin applies and
# the mod initialises with no errors). The mod uses no loader API newer than this.
loader_version=0.19.3

# Loom 1.17.21 is the newest Loom release that still runs on a Java 21 JVM
# (Loom 1.18.1+ require JVM 25). It is also the Loom line the official
# Fabric example mod pins for Minecraft 1.21.11.
loom_version=1.17.21

# ---------------------------------------------------------------------------
# Mod properties
# ---------------------------------------------------------------------------
mod_version=1.1.0+1.21.11
maven_group=com.visualspearhitbox
archives_base_name=visualspearhitbox

# ---------------------------------------------------------------------------
# Optional (soft) runtime dependencies, for the Mod Menu config screen only.
# Neither is bundled into this mod's jar; fabric.mod.json lists them under
# "recommends" so the mod still runs, toggleable via JSON, without them.
#
# Mod Menu 17.0.x is the 1.21.11 line (the 20.x+ line targets the 26.x
# Minecraft releases). Cloth Config switched to Minecraft-aligned versions, so
# 21.11.x is its 1.21.11 line.
# ---------------------------------------------------------------------------
modmenu_version=17.0.1
cloth_config_version=21.11.153

# ---------------------------------------------------------------------------
# Test-only dependencies
# ---------------------------------------------------------------------------
junit_version=5.14.4

